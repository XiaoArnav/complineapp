<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="100%" height="100%">
  <defs>
    <linearGradient id="stoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3242"/>
      <stop offset="50%" stop-color="#241e2b"/>
      <stop offset="100%" stop-color="#141018"/>
    </linearGradient>
    <linearGradient id="stoneBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3f55"/>
      <stop offset="50%" stop-color="#2c2433"/>
      <stop offset="100%" stop-color="#19131e"/>
    </linearGradient>
    <linearGradient id="goldHaze" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Gothic Arch Beam / Lancet Corbel -->
  <path d="M 10,140 Q 150,110 290,140 L 290,165 Q 150,135 10,165 Z" fill="url(#stoneBeam)" stroke="#d4af37" stroke-width="1.5" opacity="0.9"/>
  <!-- Decorative Trefoil Tracery Under Corbel -->
  <path d="M 60,155 Q 80,185 100,155 Q 120,185 140,155 Q 160,185 180,155 Q 200,185 220,155 Q 240,185 240,155" fill="none" stroke="#aa8232" stroke-width="1.2" opacity="0.6"/>

  <!-- The Sloth Body (Resting Languidly on the Beam) -->
  <!-- Fluffy, curved stone torso -->
  <ellipse cx="150" cy="115" rx="65" ry="32" fill="url(#stoneBody)" stroke="#d4af37" stroke-width="1.2"/>
  
  <!-- Sloth Head (Nodding asleep) -->
  <circle cx="95" cy="100" r="24" fill="url(#stoneBody)" stroke="#d4af37" stroke-width="1.2"/>
  
  <!-- Facial Mask Pattern -->
  <path d="M 85,92 C 80,98 80,105 87,110 C 95,115 105,110 108,102 C 108,94 95,88 85,92 Z" fill="#1b1522"/>
  <!-- Closed Sleeping Eyes (Curved slits) -->
  <path d="M 86,99 Q 90,103 94,99" fill="none" stroke="#d4af37" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Gentle Slumbering Smile -->
  <path d="M 88,108 Q 92,112 96,107" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Cute Black Nose -->
  <ellipse cx="90" cy="104" rx="2.5" ry="1.8" fill="#d4af37"/>

  <!-- Little Stone Monk Cowl / Hood over head -->
  <path d="M 75,95 Q 95,65 115,95 Q 105,82 85,82 Z" fill="#201728" stroke="#aa8232" stroke-width="1"/>

  <!-- Left Arm Hugging Beam -->
  <path d="M 125,125 C 120,145 105,150 95,148" fill="none" stroke="url(#stoneBody)" stroke-width="16" stroke-linecap="round"/>
  <!-- Curved Sloth Claws (3 iconic claws hooked over stone beam) -->
  <path d="M 90,146 Q 84,155 86,162" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 94,147 Q 89,157 91,164" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 98,148 Q 94,158 96,165" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rear Leg Hanging Softly -->
  <path d="M 195,125 C 205,145 215,152 225,150" fill="none" stroke="url(#stoneBody)" stroke-width="15" stroke-linecap="round"/>
  <path d="M 222,148 Q 228,157 225,164" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 226,149 Q 232,158 229,165" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 230,150 Q 236,159 233,166" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Little Gargoyle Wings (Folded in peaceful sleep) -->
  <path d="M 140,95 Q 170,60 190,85 Q 170,88 160,110 Z" fill="#281f33" stroke="#aa8232" stroke-width="1.2"/>
  <path d="M 155,95 Q 185,65 205,90 Q 185,93 175,115 Z" fill="#1e1626" stroke="#d4af37" stroke-width="1"/>

  <!-- Golden Halo / Sloth Day Crownlet (Faint glow) -->
  <ellipse cx="95" cy="74" rx="20" ry="6" fill="none" stroke="url(#goldHaze)" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="150" y="190" text-anchor="middle" fill="#d4af37" font-family="'MedievalSharp', serif" font-size="11" letter-spacing="2" opacity="0.8">BROTHER SILO • PATRON OF THE SLOTH</text>
</svg>
