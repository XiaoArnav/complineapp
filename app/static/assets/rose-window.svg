<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background void with rich amethyst & obsidian depth -->
    <radialGradient id="voidGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3b154a" stop-opacity="0.85"/>
      <stop offset="45%"  stop-color="#1e0b28" stop-opacity="0.7"/>
      <stop offset="75%"  stop-color="#0e0714" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060308" stop-opacity="1"/>
    </radialGradient>

    <!-- Antique Tarnished Gold / Bronze Gradient -->
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fcedb8"/>
      <stop offset="25%"  stop-color="#d4af37"/>
      <stop offset="50%"  stop-color="#9a7a24"/>
      <stop offset="75%"  stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#735916"/>
    </linearGradient>

    <!-- Deep Ruby Velvet for inner jewel highlights -->
    <linearGradient id="rubyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#8a142e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2a0008" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Dark Iron / Obsidian Came -->
    <linearGradient id="ironCame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1c1622"/>
      <stop offset="50%"  stop-color="#2c2235"/>
      <stop offset="100%" stop-color="#120e17"/>
    </linearGradient>

    <filter id="divineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════
       BASE DISK & ASTRONOMICAL CONCENTRIC RINGS
       ══════════════════════════════════════════ -->
  <circle cx="200" cy="200" r="192" fill="url(#voidGlow)" stroke="#09060d" stroke-width="4"/>
  
  <!-- Outer thin gold astronomical ring with celestial ticks -->
  <circle cx="200" cy="200" r="184" fill="none" stroke="url(#goldFiligree)" stroke-width="1.8" opacity="0.6"/>
  <circle cx="200" cy="200" r="177" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="2,6" opacity="0.45"/>
  <circle cx="200" cy="200" r="148" fill="none" stroke="#aa8232" stroke-width="1.2" opacity="0.35"/>

  <!-- ══════════════════════════════════════════
       THE OUTER CRESCENT MOON / SACRED ARC
       ══════════════════════════════════════════ -->
  <!-- Main heavy crescent band curving around outer edge -->
  <path d="M 200,46 
           C 285,46 360,115 360,200 
           C 360,285 285,354 200,354 
           C 115,354 40,285 40,200 
           C 40,115 115,46 200,46 
           Z 
           M 200,64 
           C 125,64 64,125 64,200 
           C 64,275 125,336 200,336 
           C 275,336 336,275 336,200 
           C 336,125 275,64 200,64 
           Z"
        fill="url(#ironCame)" stroke="url(#goldFiligree)" stroke-width="1.8" filter="url(#divineGlow)"/>

  <!-- Subtle inner gold filigree rim of crescent -->
  <circle cx="200" cy="200" r="136" fill="none" stroke="url(#goldFiligree)" stroke-width="1" opacity="0.4"/>

  <!-- ══════════════════════════════════════════
       NORTHERN STAR CREST (AT ZENITH)
       ══════════════════════════════════════════ -->
  <g transform="translate(200, 42)">
    <!-- 4-Pointed Gothic Diamond Star -->
    <path d="M 0,-18 Q 2,-4 14,0 Q 2,4 0,18 Q -2,4 -14,0 Q -2,-4 0,-18 Z"
          fill="url(#goldFiligree)" stroke="#0e0714" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Southern small star accent -->
  <g transform="translate(200, 348)">
    <path d="M 0,-8 Q 1,-2 6,0 Q 1,2 0,8 Q -1,2 -6,0 Q -1,-2 0,-8 Z"
          fill="url(#goldFiligree)" opacity="0.8"/>
  </g>

  <!-- ══════════════════════════════════════════
       INTERLACED HEXAGRAM (SIX-POINTED SEAL)
       ══════════════════════════════════════════ -->
  <!-- Inner subtle jewel fill in the star core -->
  <polygon points="200,75 308,262 92,262" fill="url(#rubyGlow)"/>
  <polygon points="200,325 308,138 92,138" fill="url(#rubyGlow)"/>

  <!-- TRIANGLE 1 (Pointing UP) - Thick Gothic ribbon with dual stroke -->
  <!-- Outer border -->
  <polygon points="200,75 316,266 84,266"
           fill="none" stroke="#08040a" stroke-width="16" stroke-linejoin="round"/>
  <polygon points="200,75 316,266 84,266"
           fill="none" stroke="url(#goldFiligree)" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="200,75 316,266 84,266"
           fill="none" stroke="#1d1526" stroke-width="3" stroke-linejoin="round"/>

  <!-- TRIANGLE 2 (Pointing DOWN) - Interlaced through Triangle 1 -->
  <polygon points="200,325 316,134 84,134"
           fill="none" stroke="#08040a" stroke-width="16" stroke-linejoin="round"/>
  <polygon points="200,325 316,134 84,134"
           fill="none" stroke="url(#goldFiligree)" stroke-width="7" stroke-linejoin="round"/>
  <polygon points="200,325 316,134 84,134"
           fill="none" stroke="#1d1526" stroke-width="3" stroke-linejoin="round"/>

  <!-- Inner central Hexagon border accent -->
  <polygon points="200,134 238,156 238,200 200,222 162,200 162,156"
           fill="none" stroke="url(#goldFiligree)" stroke-width="1.2" opacity="0.6"/>

  <!-- ══════════════════════════════════════════
       CENTRAL GOTHIC SPINDLE & SACRED CHALICE
       ══════════════════════════════════════════ -->
  <!-- Vertical Spindle / Lancet Spear Piercing Center -->
  <line x1="200" y1="58" x2="200" y2="342"
        stroke="#060308" stroke-width="5" stroke-linecap="round"/>
  <line x1="200" y1="58" x2="200" y2="342"
        stroke="url(#goldFiligree)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Top Spire Barb (Arrowhead at apex of upper triangle) -->
  <path d="M 200,68 L 194,84 L 200,80 L 206,84 Z"
        fill="url(#goldFiligree)" stroke="#09060d" stroke-width="0.8"/>

  <!-- Bottom Spire Spear (Arrowhead at apex of lower triangle) -->
  <path d="M 200,332 L 194,316 L 200,320 L 206,316 Z"
        fill="url(#goldFiligree)" stroke="#09060d" stroke-width="0.8"/>

  <!-- Upper Spindle Barbs -->
  <path d="M 188,144 Q 200,154 200,166 Q 200,154 212,144"
        fill="none" stroke="url(#goldFiligree)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ══════════════════════════════════════════
       THE SACRED CHALICE / NOCTURNE FLAME HEART
       ══════════════════════════════════════════ -->
  <!-- Silhouetted sacred bud/flame in the very center -->
  <g transform="translate(200, 200)">
    <!-- Aura behind heart -->
    <circle cx="0" cy="0" r="22" fill="#5c1e6b" opacity="0.6"/>
    <circle cx="0" cy="0" r="16" fill="#8a142e" opacity="0.4"/>

    <!-- Central Gothic Chalice / Night Bloom Silhouette -->
    <!-- Outer gold contour -->
    <path d="M 0,-30 
             C 7,-20 14,-10 14,4 
             C 14,16 6,24 0,30 
             C -6,24 -14,16 -14,4 
             C -14,-10 -7,-20 0,-30 Z"
          fill="#110a18" stroke="url(#goldFiligree)" stroke-width="2.2"/>

    <!-- Inner Fleur-de-lis / Flame Tracery -->
    <path d="M 0,-24 
             C 4,-16 8,-8 8,2 
             C 8,10 3,18 0,22 
             C -3,18 -8,10 -8,2 
             C -8,-8 -4,-16 0,-24 Z"
          fill="url(#goldFiligree)" opacity="0.9"/>
    
    <!-- Central Golden Core / Eye of the Seal -->
    <ellipse cx="0" cy="2" rx="3.5" ry="5.5" fill="#fff9d6"/>
    <circle cx="0" cy="2" r="1.5" fill="#7a1400"/>

    <!-- Left & Right Chalice Winglets (Thorns) -->
    <path d="M -14,0 Q -24,-6 -22,-14 Q -18,-6 -10,-4"
          fill="url(#goldFiligree)" stroke="#09060d" stroke-width="0.8"/>
    <path d="M 14,0 Q 24,-6 22,-14 Q 18,-6 10,-4"
          fill="url(#goldFiligree)" stroke="#09060d" stroke-width="0.8"/>
  </g>

  <!-- Lower Spindle Barbs -->
  <path d="M 188,256 Q 200,246 200,234 Q 200,246 212,256"
        fill="none" stroke="url(#goldFiligree)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Celestial Constellation Dots around Hexagram Points -->
  <circle cx="200" cy="98"  r="2.5" fill="url(#goldFiligree)"/>
  <circle cx="200" cy="302" r="2.5" fill="url(#goldFiligree)"/>
  <circle cx="114" cy="150" r="2.5" fill="url(#goldFiligree)"/>
  <circle cx="286" cy="150" r="2.5" fill="url(#goldFiligree)"/>
  <circle cx="114" cy="250" r="2.5" fill="url(#goldFiligree)"/>
  <circle cx="286" cy="250" r="2.5" fill="url(#goldFiligree)"/>
</svg>
