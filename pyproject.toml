[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compline"
version = "1.0.0"
description = "A candlelit gothic wind-down companion designed for restful sleep induction with local Gemma 2, real-time 3D astrolabe, and vinyl acoustics."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Arnav Patel", email = "322868724+XiaoArnav@users.noreply.github.com" }
]
requires-python = ">=3.9"
keywords = [
  "hacktoberfest",
  "hacktoberfest2026",
  "hf26challenge",
  "gemma",
  "gemma2",
  "slow-and-steady",
  "sloth-day",
  "sleep-companion",
  "offline-ai",
  "astrolabe",
  "soundscape",
  "web-audio",
  "open-source",
  "ai"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Sound/Audio",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

[project.urls]
Homepage = "https://complineapp.vercel.app"
Repository = "https://github.com/XiaoArnav/complineapp"
"Bug Tracker" = "https://github.com/XiaoArnav/complineapp/issues"
"DEV Submission" = "https://dev.to/challenges/hacktoberfest-week3-2026-10-19"
